<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    
    <!-- Import script model-viewer dari Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        /* Menghilangkan margin bawaan browser dan membuat background pas satu layar penuh */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f2f5; /* Warna background di luar model jika diperlukan */
        }

        /* Mengatur agar komponen 3D memenuhi seluruh layar browser */
        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
            --poster-color: transparent; /* Menghilangkan warna background saat loading */
        }
    </style>
</head>
<body>

    <!-- Komponen 3D langsung ditaruh tanpa teks judul dan box container -->
    <model-viewer 
        src="spongebob_squarepants.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>
    </model-viewer>

</body>
</html>
